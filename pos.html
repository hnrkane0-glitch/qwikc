<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickCart POS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#171525;--muted:#777486;--line:#e9e7ef;--accent:#7655e8;--bg:#f6f5fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}.bar{background:#171525;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font:800 20px Manrope}.brand b{color:#b8a5ff}.wrap{max-width:1400px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:1fr 360px;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head h2{margin:0;font:800 22px Manrope}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.prod{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:#fff}.prod:hover{border-color:#b6a5f5}.prod img{width:100%;height:110px;object-fit:contain;background:#f7f6fa;border-radius:8px}.prod strong{display:block;margin:8px 0 4px}.price{font-weight:800;color:var(--accent)}.cartrow{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted);font-size:12px}.total{font:800 24px Manrope;display:flex;justify-content:space-between;padding:18px 0}.btn{border:0;background:var(--accent);color:#fff;padding:13px;border-radius:10px;font-weight:800;width:100%}.btn:disabled{opacity:.4}.qty button{border:1px solid var(--line);background:white;border-radius:5px;padding:3px 8px}@media(max-width:850px){.wrap{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="bar"><div class="brand">Quick<b>Cart</b> <span style="font:500 12px 'DM Sans';color:#aaa">/ Point of Sale</span></div><button onclick="goBack()" style="background:#ffffff18;border:1px solid #ffffff33;color:white;border-radius:8px;padding:8px 12px">← Dashboard</button></header><main class="wrap"><section class="panel"><div class="head"><h2>Products</h2><span id="count" class="muted">Loading…</span></div><input id="search" class="search" placeholder="Search products…" oninput="render()"><div id="products" class="grid"></div></section><aside class="panel"><div class="head"><h2>Current sale</h2><button onclick="clearCart()" style="border:0;background:none;color:#c44">Clear</button></div><div id="cart"></div><div class="total"><span>Total</span><span id="total">₦0</span></div><button class="btn" id="checkout" onclick="completeSale()" disabled>Complete sale</button><p class="muted">Sales are saved to this store owner's private orders database.</p><div id="msg" class="muted"></div></aside></main><script src="qc-db.js"></script><script>
const base=QCDB.base();let products=[],cart=[];
const money=n=>'₦'+(Number(n)||0).toLocaleString('en-NG');
async function load(){try{let r=await fetch(base+'/products.json');let d=await r.json()||{};products=Object.keys(d).map(k=>({...d[k],_id:k})).filter(p=>p&&p.status!=='deleted');render();}catch(e){document.getElementById('products').textContent='Could not load products.';}}
function render(){let q=document.getElementById('search').value.toLowerCase(),list=products.filter(p=>(p.name||'').toLowerCase().includes(q));document.getElementById('count').textContent=list.length+' items';document.getElementById('products').innerHTML=list.length?list.map(p=>'<button class="prod" data-add="'+esc(p._id)+'">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'<div style="height:110px;background:#f7f6fa;border-radius:8px;display:grid;place-items:center">✦</div>')+'<strong>'+esc(p.name||'Product')+'</strong><span class="price">'+money(p.price)+'</span></button>').join(''):'<p class="muted">No products found.</p>';document.getElementById('cart').innerHTML=cart.length?cart.map(x=>'<div class="cartrow"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+money(x.price)+' each</div></div><div class="qty"><button data-id="'+esc(x._id)+'" data-qty="-1">−</button> '+x.qty+' <button data-id="'+esc(x._id)+'" data-qty="1">+</button></div></div>').join(''):'<p class="muted">Add products to start a sale.</p>';let total=cart.reduce((n,x)=>n+x.qty*(+x.price||0),0);document.getElementById('total').textContent=money(total);document.getElementById('checkout').disabled=!cart.length;}
document.addEventListener('click',e=>{let a=e.target.closest('[data-add]');if(a)add(a.dataset.add);let q=e.target.closest('[data-qty]');if(q)qty(q.dataset.id,+q.dataset.qty);});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function add(id){let p=products.find(x=>x._id===id);if(!p)return;let x=cart.find(x=>x._id===id);if(x)x.qty++;else cart.push({...p,qty:1});render();}
function qty(id,d){cart=cart.map(x=>x._id===id?{...x,qty:x.qty+d}:x).filter(x=>x.qty>0);render();}
function clearCart(){cart=[];render();}
async function completeSale(){let b=document.getElementById('checkout');b.disabled=true;b.textContent='Saving…';let total=cart.reduce((n,x)=>n+x.qty*(+x.price||0),0),order={items:cart.map(x=>({id:x._id,name:x.name,price:+x.price||0,quantity:x.qty})),total,status:'completed',source:'pos',createdAt:new Date().toISOString()};try{let r=await fetch(base+'/orders.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)});if(!r.ok)throw Error('Save failed');document.getElementById('msg').textContent='Sale saved successfully.';cart=[];render();}catch(e){document.getElementById('msg').textContent='Could not save sale. Please retry.';}b.disabled=!cart.length;b.textContent='Complete sale';}
function goBack(){if(window.parent&&window.parent!==window&&window.parent.qcNavigate)window.parent.qcNavigate('/dashboard');else location.href='admin.html';}load();
</script></body></html>
